[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "everyday_sensing"
version = "0.1.0"
description = "Offline preprocessing for everyday-objects vibration sensing"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "matplotlib>=3.11.2",
    "pyserial>=3.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tools/dashboard"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tools/dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Lab scripts are kept as delivered; only style rules are relaxed.
"tools/dashboard/*.py" = ["E501", "E731", "B023", "B905"]
"firmware/vpu_lab_demo/receiver.py" = ["I001"]
